<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="632" viewBox="0 0 1000 632" font-family="Helvetica, Arial, sans-serif">
<title>pm1 architecture</title>
<rect width="1000" height="632" fill="#FFFFFF"/>
<text x="30.0" y="34.0" font-size="17" fill="#2C2C2A" text-anchor="start" font-weight="700">pm1 (Precision Memory): raw records are the evidence; no LLM at write time, no generative model at read time</text>
<rect x="20" y="56" width="960" height="78" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="34" y="76" font-size="13" font-weight="600" fill="#5F5E5A">1  Sources (captured read-only)</text>
<rect x="34.0" y="86" width="178.4" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="123.2" y="102.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Claude Code</text>
<text x="123.2" y="118.0" text-anchor="middle" font-size="12" fill="#04342C">transcripts + hooks</text>
<rect x="222.4" y="86" width="178.4" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="311.6" y="102.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Codex</text>
<text x="311.6" y="118.0" text-anchor="middle" font-size="12" fill="#04342C">session files</text>
<rect x="410.8" y="86" width="178.4" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="500.0" y="102.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Cursor</text>
<text x="500.0" y="118.0" text-anchor="middle" font-size="12" fill="#04342C">chat database</text>
<rect x="599.2" y="86" width="178.4" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="688.4" y="102.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Cowork</text>
<text x="688.4" y="118.0" text-anchor="middle" font-size="12" fill="#04342C">exported sessions</text>
<rect x="787.6" y="86" width="178.4" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="876.8" y="102.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Document folders</text>
<text x="876.8" y="118.0" text-anchor="middle" font-size="12" fill="#04342C">MD, PDF, DOCX, XLSX</text>
<rect x="20" y="146" width="960" height="112" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="34" y="166" font-size="13" font-weight="600" fill="#5F5E5A">2  Ingestion (no LLM)</text>
<rect x="34.0" y="176" width="178.4" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="123.2" y="192.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Redact secrets</text>
<text x="123.2" y="208.0" text-anchor="middle" font-size="12" fill="#04342C">before storage</text>
<rect x="222.4" y="176" width="178.4" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="311.6" y="192.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Split into spans</text>
<text x="311.6" y="208.0" text-anchor="middle" font-size="12" fill="#04342C">at most 1,200 chars</text>
<rect x="410.8" y="176" width="178.4" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="500.0" y="192.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">SQLite store</text>
<text x="500.0" y="208.0" text-anchor="middle" font-size="12" fill="#04342C">raw records only</text>
<rect x="599.2" y="176" width="178.4" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="688.4" y="192.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">FTS5 BM25 index</text>
<text x="688.4" y="208.0" text-anchor="middle" font-size="12" fill="#04342C">Porter stemming, jieba</text>
<rect x="787.6" y="176" width="178.4" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="876.8" y="192.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">e5-small vectors</text>
<text x="876.8" y="208.0" text-anchor="middle" font-size="12" fill="#04342C">CPU ONNX or GGUF service</text>
<rect x="34.0" y="222" width="304.0" height="28" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="186.0" y="241.0" text-anchor="middle" font-size="12" fill="#042C53">records grouped by session and project</text>
<rect x="348.0" y="222" width="304.0" height="28" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="500.0" y="241.0" text-anchor="middle" font-size="12" fill="#042C53">vectors filled in by a background worker</text>
<rect x="662.0" y="222" width="304.0" height="28" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="814.0" y="241.0" text-anchor="middle" font-size="12" fill="#444441">LLM fact index: eval only, off</text>
<rect x="20" y="270" width="960" height="118" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="34" y="290" font-size="13" font-weight="600" fill="#5F5E5A">3  Retrieval: search_sessions (production)</text>
<rect x="34.0" y="300" width="147.0" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="107.5" y="317.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">zh-en translation</text>
<text x="107.5" y="333.0" text-anchor="middle" font-size="12" fill="#04342C">optional keyword lane</text>
<rect x="191.0" y="300" width="147.0" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="264.5" y="317.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">BM25</text>
<text x="264.5" y="333.0" text-anchor="middle" font-size="12" fill="#04342C">common words dropped</text>
<rect x="348.0" y="300" width="147.0" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="421.5" y="317.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">e5 dense</text>
<text x="421.5" y="333.0" text-anchor="middle" font-size="12" fill="#04342C">exact cosine scan</text>
<rect x="505.0" y="300" width="147.0" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="578.5" y="317.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">RRF fusion</text>
<text x="578.5" y="333.0" text-anchor="middle" font-size="12" fill="#04342C">pool of 100</text>
<rect x="662.0" y="300" width="147.0" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="735.5" y="317.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Qwen3-Reranker-0.6B</text>
<text x="735.5" y="333.0" text-anchor="middle" font-size="12" fill="#04342C">all 100, waits up to 8 s</text>
<rect x="819.0" y="300" width="147.0" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="892.5" y="317.0" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Pack to budget</text>
<text x="892.5" y="333.0" text-anchor="middle" font-size="12" fill="#04342C">4K tokens, by session</text>
<text x="34.0" y="362.0" font-size="12" fill="#5F5E5A" text-anchor="start">Without a reranker the fused order is kept: CPU-only search over about 745 spans takes 6 ms p50 on two threads.</text>
<text x="34.0" y="378.0" font-size="12" fill="#5F5E5A" text-anchor="start">With the reranker: production p50 3.7 s per call, almost all of it reranking.</text>
<rect x="20" y="400" width="960" height="96" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="34" y="420" font-size="13" font-weight="600" fill="#5F5E5A">4  MCP server (stdio) and governance</text>
<rect x="34.0" y="430" width="461.0" height="28" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="264.5" y="449.0" text-anchor="middle" font-size="12" fill="#04342C">search_sessions, open_record, session_brief, code_history</text>
<rect x="505.0" y="430" width="461.0" height="28" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="735.5" y="449.0" text-anchor="middle" font-size="12" fill="#04342C">search_docs, cite, save_note, search_notes</text>
<rect x="34.0" y="462" width="304.0" height="28" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="186.0" y="481.0" text-anchor="middle" font-size="12" fill="#04342C">results wrapped as evidence, not instructions</text>
<rect x="348.0" y="462" width="304.0" height="28" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="500.0" y="481.0" text-anchor="middle" font-size="12" fill="#04342C">rules: agents propose, the user approves</text>
<rect x="662.0" y="462" width="304.0" height="28" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="814.0" y="481.0" text-anchor="middle" font-size="12" fill="#04342C">one local SQLite file</text>
<rect x="20" y="508" width="960" height="100" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="34" y="528" font-size="13" font-weight="600" fill="#5F5E5A">5  Tested and not adopted (pre-registered rule not met, or cost too high)</text>
<rect x="34.0" y="538" width="225.5" height="28" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="146.8" y="557.0" text-anchor="middle" font-size="12" fill="#444441">1024-d / 2560-d vectors</text>
<rect x="269.5" y="538" width="225.5" height="28" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="382.2" y="557.0" text-anchor="middle" font-size="12" fill="#444441">Qwen3-Reranker-4B</text>
<rect x="505.0" y="538" width="225.5" height="28" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="617.8" y="557.0" text-anchor="middle" font-size="12" fill="#444441">graph two-hop recall</text>
<rect x="740.5" y="538" width="225.5" height="28" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="853.2" y="557.0" text-anchor="middle" font-size="12" fill="#444441">second-round recall</text>
<rect x="34.0" y="570" width="225.5" height="28" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="146.8" y="589.0" text-anchor="middle" font-size="12" fill="#444441">planning before search</text>
<rect x="269.5" y="570" width="225.5" height="28" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="382.2" y="589.0" text-anchor="middle" font-size="12" fill="#444441">budgets above 4K</text>
<rect x="505.0" y="570" width="225.5" height="28" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="617.8" y="589.0" text-anchor="middle" font-size="12" fill="#444441">grep-style literal channel</text>
<rect x="740.5" y="570" width="225.5" height="28" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="853.2" y="589.0" text-anchor="middle" font-size="12" fill="#444441">LLM fact index (eval only)</text>
<text x="34.0" y="620.0" font-size="11" fill="#888780" text-anchor="start">Green: in production. Blue: notes. Grey: off by default or not adopted. Details: docs/DESIGN.md, docs/EVALUATION.md.</text>
</svg>
